openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: moments
    description: Moment journal entries
  - name: entries
    description: Synced journal entries (all check-in kinds)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moments:
    post:
      operationId: saveMoment
      tags: [moments]
      summary: Save a moment
      description: Persists current ring values with a timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMomentRequest"
      responses:
        "201":
          description: Moment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getMoments
      tags: [moments]
      summary: Get recent moments
      description: Returns the last 20 moments for a device
      parameters:
        - in: query
          name: deviceId
          required: true
          schema:
            type: string
          description: Device/session identifier
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of moments to return
      responses:
        "200":
          description: List of moments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentsListResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entries:
    get:
      operationId: getEntries
      tags: [entries]
      summary: Get journal entries for a device
      description: >-
        Returns synced journal entries for a device, oldest first. When
        `since` is provided, only entries created or updated at or after
        that server timestamp are returned (incremental sync); the response
        always includes `serverTime` to use as the next `since` cursor.
      parameters:
        - in: query
          name: deviceId
          required: true
          schema:
            type: string
          description: Device/session identifier
        - in: query
          name: since
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Only return entries created/updated at or after this server
            timestamp (from a previous response's serverTime)
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesListResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertEntry
      tags: [entries]
      summary: Create or update a journal entry
      description: Upserts a single journal entry keyed by deviceId + entry id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpsert"
      responses:
        "200":
          description: Entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entries/bulk:
    post:
      operationId: bulkUpsertEntries
      tags: [entries]
      summary: Bulk-upload journal entries
      description: Upserts many entries at once (initial sync of local data)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntriesBulkUpsert"
      responses:
        "200":
          description: Entries saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntriesCountResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entries/delete:
    post:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete a journal entry
      description: Removes a single journal entry for a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryDelete"
      responses:
        "204":
          description: Entry deleted
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SaveMomentRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Device/session identifier from localStorage
        fullness:
          type: integer
          minimum: 0
          maximum: 10
        energy:
          type: integer
          minimum: 0
          maximum: 10
        hydration:
          type: integer
          minimum: 0
          maximum: 10
        reflection:
          type: string
          nullable: true
      required:
        - deviceId
        - fullness
        - energy
        - hydration
    MomentRecord:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        fullness:
          type: integer
        energy:
          type: integer
        hydration:
          type: integer
        reflection:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - fullness
        - energy
        - hydration
        - createdAt
    MomentsListResponse:
      type: object
      properties:
        moments:
          type: array
          items:
            $ref: "#/components/schemas/MomentRecord"
      required:
        - moments
    JournalEntry:
      type: object
      description: A journal entry as the app stores it; kind-specific fields allowed
      additionalProperties: true
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            [before, during, after, hydration, energy, movement, followup, moment]
        at:
          type: string
          format: date-time
      required:
        - id
        - kind
        - at
    EntryUpsert:
      type: object
      properties:
        deviceId:
          type: string
        entry:
          $ref: "#/components/schemas/JournalEntry"
      required:
        - deviceId
        - entry
    EntryDelete:
      type: object
      properties:
        deviceId:
          type: string
        entryId:
          type: string
      required:
        - deviceId
        - entryId
    EntriesBulkUpsert:
      type: object
      properties:
        deviceId:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
      required:
        - deviceId
        - entries
    EntriesListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/JournalEntry"
        serverTime:
          type: string
          format: date-time
          description: Server clock at query time; pass as `since` next sync
      required:
        - entries
        - serverTime
    EntriesCountResponse:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
