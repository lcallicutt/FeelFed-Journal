openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: moments
    description: Moment journal entries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moments:
    post:
      operationId: saveMoment
      tags: [moments]
      summary: Save a moment
      description: Persists current ring values with a timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMomentRequest"
      responses:
        "201":
          description: Moment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentRecord"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getMoments
      tags: [moments]
      summary: Get recent moments
      description: Returns the last 20 moments for a device
      parameters:
        - in: query
          name: deviceId
          required: true
          schema:
            type: string
          description: Device/session identifier
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of moments to return
      responses:
        "200":
          description: List of moments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentsListResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SaveMomentRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Device/session identifier from localStorage
        fullness:
          type: integer
          minimum: 0
          maximum: 10
        energy:
          type: integer
          minimum: 0
          maximum: 10
        hydration:
          type: integer
          minimum: 0
          maximum: 10
        reflection:
          type: string
          nullable: true
      required:
        - deviceId
        - fullness
        - energy
        - hydration
    MomentRecord:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: string
        fullness:
          type: integer
        energy:
          type: integer
        hydration:
          type: integer
        reflection:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - deviceId
        - fullness
        - energy
        - hydration
        - createdAt
    MomentsListResponse:
      type: object
      properties:
        moments:
          type: array
          items:
            $ref: "#/components/schemas/MomentRecord"
      required:
        - moments
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
